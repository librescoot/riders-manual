name: Build Rider's Manual PDFs

on:
  push:
    branches: [main]
    tags:
      - "v*"
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils imagemagick
          python3 -m pip install --upgrade pip fonttools
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null && ! command -v chromium-browser >/dev/null; then
            sudo apt-get install -y --no-install-recommends chromium-browser
          fi

      - name: Build and verify PDFs for all languages
        run: |
          python3 source/build.py --lang all --strict --no-previews --out-dir dist
          (cd dist && sha256sum *.pdf > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          ls -lh dist/

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: librescoot-riders-manual-pdfs
          path: |
            dist/*.pdf
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.pdf dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/*.pdf dist/SHA256SUMS.txt \
              --title "Librescoot Rider's Manual ${TAG}" \
              --notes "Illustrated A5 Rider's Manual PDFs for Librescoot ${TAG} (built from source by CI)."
          fi
